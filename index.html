  <body>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #10131a; }
      /* Анимированный экран загрузки — показывается мгновенно до запуска React
         и автоматически исчезает, когда React монтирует приложение в #root. */
      #boot {
        position: fixed; inset: 0; z-index: 9999; overflow: hidden;
        display: flex; align-items: center; justify-content: center;
        background: #10131a;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      /* Фоновое свечение, плавно меняющее цвет */
      #boot::before {
        content: ''; position: absolute; inset: -25%;
        background:
          radial-gradient(40% 35% at 35% 40%, rgba(0,240,255,0.18), transparent 70%),
          radial-gradient(40% 35% at 68% 65%, rgba(119,1,208,0.20), transparent 70%),
          radial-gradient(35% 30% at 55% 30%, rgba(0,226,144,0.14), transparent 70%);
        animation: bootHue 6s linear infinite, bootDrift 8s ease-in-out infinite;
      }
      #boot .stage {
        position: relative; z-index: 1;
        display: flex; flex-direction: column; align-items: center; gap: 22px;
      }
      #boot .logo {
        width: 84px; height: 84px; border-radius: 20px;
        animation: bootFloat 2.2s ease-in-out infinite, bootGlow 2.2s ease-in-out infinite;
      }
      #boot .logo img { width: 100%; height: 100%; border-radius: 20px; display: block; }
      #boot .title {
        font-size: 20px; font-weight: 800; letter-spacing: 0.04em;
        background: linear-gradient(90deg, #00f0ff, #00e290, #b47aff, #00f0ff);
        background-size: 300% 100%;
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
        animation: bootTitle 3s ease-in-out infinite;
      }
      #boot .bar { width: 168px; height: 4px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden; }
      #boot .bar span {
        display: block; width: 40%; height: 100%; border-radius: 999px;
        background: linear-gradient(90deg, #00f0ff, #00e290, #b47aff);
        animation: bootSlide 1.2s ease-in-out infinite;
      }
      /* Парящие частицы */
      #boot .p { position: absolute; border-radius: 50%; opacity: 0; animation: bootParticle 3.6s ease-in-out infinite; }
      @keyframes bootFloat { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
      @keyframes bootGlow {
        0%,100% { box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 10px 30px rgba(0,240,255,0.18) }
        50%     { box-shadow: 0 0 0 1px rgba(255,255,255,0.10), 0 16px 48px rgba(0,240,255,0.42) }
      }
      @keyframes bootTitle { 0%,100% { background-position: 0% 50%; opacity: .7 } 50% { background-position: 100% 50%; opacity: 1 } }
      @keyframes bootSlide { 0% { transform: translateX(-120%) } 100% { transform: translateX(320%) } }
      @keyframes bootHue { to { filter: hue-rotate(360deg) } }
      @keyframes bootDrift { 0%,100% { transform: translate(0,0) scale(1) } 50% { transform: translate(2%,-2%) scale(1.06) } }
      @keyframes bootParticle {
        0%   { transform: translateY(10px) scale(.6); opacity: 0 }
        30%  { opacity: .85 }
        70%  { opacity: .85 }
        100% { transform: translateY(-28px) scale(1); opacity: 0 }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot::before, #boot .logo, #boot .title, #boot .bar span, #boot .p { animation: none }
        #boot .p { opacity: .5 }
      }
    </style>
    <div id="root">
      <div id="boot">
        <span class="p" style="left:18%; top:32%; width:6px; height:6px; background:#00f0ff; animation-delay:0s"></span>
        <span class="p" style="left:78%; top:28%; width:5px; height:5px; background:#b47aff; animation-delay:.4s"></span>
        <span class="p" style="left:30%; top:68%; width:4px; height:4px; background:#00e290; animation-delay:.9s"></span>
        <span class="p" style="left:65%; top:72%; width:6px; height:6px; background:#00f0ff; animation-delay:1.3s"></span>
        <span class="p" style="left:50%; top:20%; width:4px; height:4px; background:#b47aff; animation-delay:1.7s"></span>
        <span class="p" style="left:12%; top:55%; width:5px; height:5px; background:#00e290; animation-delay:2.1s"></span>
        <span class="p" style="left:86%; top:58%; width:4px; height:4px; background:#00f0ff; animation-delay:2.5s"></span>
        <span class="p" style="left:42%; top:82%; width:5px; height:5px; background:#b47aff; animation-delay:2.9s"></span>
        <div class="stage">

          <div class="title">APSNY-TRANSFER</div>
          <div class="bar"><span></span></div>
        </div>
      </div>
    </div>
