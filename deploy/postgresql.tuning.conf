# Настройки PostgreSQL под сервер 4 ядра / 8 ГБ (тариф «Отрыв» на FirstVDS).
#
# Подкладывается в контейнер db и подключается в конце основного
# postgresql.conf строкой:
#     include = '/etc/postgresql/postgresql.tuning.conf'
# либо монтируется как volume и передаётся через command: -c config_file=...
#
# Значения не универсальные, а посчитанные под этот профиль нагрузки:
# короткие запросы по индексу, база целиком помещается в память ещё долго
# (на объёме «сервис проработал год» она весит 240 МБ).

# Кэш страниц самого PostgreSQL. Четверть памяти — общее правило, и здесь оно
# работает: вся база с запасом влезает, дисковых чтений почти не будет.
shared_buffers = 2GB

# Не выделяет память, а сообщает планировщику, сколько её всего доступно под
# кэш (свой + файловый кэш ядра). Влияет на выбор между индексом и полным
# перебором: занизишь — планировщик начнёт зря сканировать таблицы.
effective_cache_size = 5GB

# Память на одну сортировку. Запросов с тяжёлой сортировкой в проекте нет
# (после индекса ленты сортировка вообще ушла из плана), 16 МБ с запасом.
# Считать надо на соединение и на операцию: 100 соединений × 16 МБ — верхняя
# граница, до которой в реальности не доходит.
work_mem = 16MB

# Для VACUUM, CREATE INDEX и прочего обслуживания. Разово и не одновременно.
maintenance_work_mem = 512MB

# Больше не нужно: тысяча пользователей не означает тысячу соединений, их
# мультиплексирует пул PostgREST (db-pool = 20–30). Каждое соединение —
# отдельный процесс со своей памятью, поэтому запас здесь вреден.
max_connections = 100

# SSD/NVMe, а не диск с блинами. Значение по умолчанию (4.0) описывает
# механику головок и на твердотельном накопителе заставляет планировщик
# избегать индексов там, где они выгодны.
random_page_cost = 1.1
effective_io_concurrency = 200

# Учёт времени ввода-вывода в статистике. Стоит доли процента, а без него
# невозможно понять, запрос ждал диска или считал.
track_io_timing = on

# Сбор статистики по запросам. Первое, куда смотреть, когда «всё тормозит».
shared_preload_libraries = 'pg_stat_statements,pg_cron'
pg_stat_statements.max = 5000
pg_stat_statements.track = top

# Журнал упреждающей записи. 1 ГБ между контрольными точками — чтобы под
# нагрузкой они не случались каждую минуту, размазывая запись равномерно.
max_wal_size = 1GB
min_wal_size = 128MB
checkpoint_completion_target = 0.9

# Записывать в журнал запросы дольше секунды. Не для отладки, а чтобы
# деградация не осталась незамеченной.
log_min_duration_statement = 1000
