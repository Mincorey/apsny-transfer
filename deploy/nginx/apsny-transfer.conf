# nginx для APSNY-TRANSFER после переезда с Vercel.
#
# Два сервера: статика фронтенда и прокси к API (Kong из docker-compose
# Supabase). Заголовки безопасности перенесены из vercel.json — там они
# с 12.08.2026 заданы в боевом режиме, а не Report-Only.
#
# ЗАМЕНИТЬ ПЕРЕД ПРИМЕНЕНИЕМ: <ДОМЕН> — на свой домен, здесь и в
# apsny-security-headers.conf.
#
# УСТАНОВКА (два файла):
#   sudo cp apsny-security-headers.conf /etc/nginx/snippets/
#   sudo cp apsny-transfer.conf         /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/apsny-transfer.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# ПРОВЕРКА после установки — обязательная, глазами разницу не видно:
#   for p in / /index.html /trips/1 /sw.js /manifest.json /nope; do
#     printf '%-14s ' "$p"; curl -sI "https://<ДОМЕН>$p" | grep -ci -E 'content-security-policy|strict-transport-security'
#   done
# В каждой строке должно быть 2. Для файла из /assets/ — тоже 2.
#
# Изменено 29.09.2026 (аудит, пункт В-2): заголовки безопасности вынесены в
# отдельный файл и подключаются в каждом location — раньше index.html
# отдавался без CSP и HSTS; `http2 on;` заменён на совместимую запись.

# --------------------------------------------------------------------------
# Фронтенд
# --------------------------------------------------------------------------
server {
    # `listen ... http2` вместо отдельной директивы `http2 on;`: та появилась
    # только в nginx 1.25.1, а в Ubuntu 22.04/24.04 из коробки 1.18/1.24 —
    # с `http2 on;` nginx там просто не запустится. На новых версиях эта
    # запись тоже работает (с предупреждением в журнале).
    listen 443 ssl http2;
    server_name <ДОМЕН>;

    ssl_certificate     /etc/letsencrypt/live/<ДОМЕН>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<ДОМЕН>/privkey.pem;

    root /var/www/apsny/dist;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;
    gzip_comp_level 5;

    # ВАЖНО: заголовки безопасности подключаются в КАЖДОМ location ниже, а не
    # здесь. Объяснение — в самом файле snippets/apsny-security-headers.conf.
    # Добавляя новый location, не забудьте строку include.

    # Одностраничное приложение: любой путь отдаёт index.html, маршрутизацию
    # делает React. Без этого прямой заход на /trips/123 вернёт 404.
    # (Переход на index.html внутренний — ответ получит заголовки из
    # location = /index.html.)
    location / {
        try_files $uri $uri/ /index.html;
        include snippets/apsny-security-headers.conf;
    }

    # Имена файлов в assets содержат хеш содержимого, поэтому кэшировать
    # можно навсегда: изменится файл — изменится имя.
    location /assets/ {
        # Один заголовок вместо пары expires + add_header: иначе в ответе
        # оказывается два Cache-Control.
        add_header Cache-Control "public, max-age=31536000, immutable";
        include snippets/apsny-security-headers.conf;
    }

    # А вот index.html кэшировать нельзя: в нём ссылки на те самые хеши.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        include snippets/apsny-security-headers.conf;
    }

    # Service Worker тоже без кэша — иначе обновление сайта доходит до
    # пользователей с опозданием до суток (так же задано в vercel.json).
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
        include snippets/apsny-security-headers.conf;
    }

    # Значки и манифест: адреса версионируются вручную (?v=2), поэтому
    # долгий кэш безопасен, но не вечный — на случай, если версию забудут.
    location ~* ^/(icons/|favicon\.ico|manifest\.json) {
        add_header Cache-Control "public, max-age=604800";
        include snippets/apsny-security-headers.conf;
    }
}

# --------------------------------------------------------------------------
# API — прокси к Kong
# --------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name api.<ДОМЕН>;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/api.<ДОМЕН>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.<ДОМЕН>/privkey.pem;

    # Ответы бывают крупные (лента — 33 КБ), заголовки с JWT тоже немаленькие.
    client_max_body_size 10m;      # загрузка аватаров и фото машин
    proxy_read_timeout 90s;        # websocket Realtime не должен рваться

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Realtime ходит по websocket. Без этих трёх строк подписки на
        # странице поездки не поднимутся, а цена перестанет обновляться живьём.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # СЖАТИЕ — самое важное в этом файле.
    #
    # Сейчас ответы сжимают Supabase и Vercel. После переезда это исчезнет
    # молча: Kong по умолчанию не сжимает ничего, сайт продолжит работать,
    # просто съест канал. Замерено: ответ ленты 33 982 Б без сжатия и 4 789 Б
    # с gzip — в семь раз. При тысяче одновременных вкладок это 17,7 против
    # 2,5 Мбит/с, при пяти тысячах — 88 Мбит/с из тарифных 100.
    gzip            on;
    gzip_proxied    any;    # ключевая строка: без неё проксированное не сжимается
    gzip_types      application/json;
    gzip_min_length 512;    # мелочь сжимать дороже, чем отдать как есть
    gzip_comp_level 5;      # выше — заметно дороже по процессору, выигрыш копеечный

    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

# --------------------------------------------------------------------------
# Перенаправление с http
# --------------------------------------------------------------------------
server {
    listen 80;
    server_name <ДОМЕН> api.<ДОМЕН>;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
