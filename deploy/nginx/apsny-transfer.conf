# nginx для APSNY-TRANSFER после переезда с Vercel.
#
# Два сервера: статика фронтенда и прокси к API (Kong из docker-compose
# Supabase). Заголовки безопасности перенесены из vercel.json — там они
# с 12.08.2026 заданы в боевом режиме, а не Report-Only.
#
# ЗАМЕНИТЬ ПЕРЕД ПРИМЕНЕНИЕМ: <ДОМЕН> — на свой домен.

# --------------------------------------------------------------------------
# Фронтенд
# --------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name <ДОМЕН>;

    ssl_certificate     /etc/letsencrypt/live/<ДОМЕН>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<ДОМЕН>/privkey.pem;

    root /var/www/apsny/dist;
    index index.html;

    # Одностраничное приложение: любой путь отдаёт index.html, маршрутизацию
    # делает React. Без этого прямой заход на /trips/123 вернёт 404.
    location / { try_files $uri $uri/ /index.html; }

    # Имена файлов в assets содержат хеш содержимого, поэтому кэшировать
    # можно навсегда: изменится файл — изменится имя.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # А вот index.html кэшировать нельзя: в нём ссылки на те самые хеши.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Значки и манифест: адреса версионируются вручную (?v=2), поэтому
    # долгий кэш безопасен, но не вечный — на случай, если версию забудут.
    location ~* ^/(icons/|favicon\.ico|manifest\.json) {
        expires 7d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;
    gzip_comp_level 5;

    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Политика содержимого. Отличие от vercel.json ровно одно, но критичное:
    # домен Supabase заменён на свой API. Забыть это — значит получить сайт,
    # который открывается, но не может обратиться к базе: браузер молча
    # блокирует все запросы, а в консоли будет только жалоба на CSP.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com https://api.<ДОМЕН>; connect-src 'self' https://api.<ДОМЕН> wss://api.<ДОМЕН>; worker-src 'self'; manifest-src 'self'; form-action 'self' https://yoomoney.ru; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
}

# --------------------------------------------------------------------------
# API — прокси к Kong
# --------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name api.<ДОМЕН>;

    ssl_certificate     /etc/letsencrypt/live/api.<ДОМЕН>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.<ДОМЕН>/privkey.pem;

    # Ответы бывают крупные (лента — 33 КБ), заголовки с JWT тоже немаленькие.
    client_max_body_size 10m;      # загрузка аватаров и фото машин
    proxy_read_timeout 90s;        # websocket Realtime не должен рваться

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Realtime ходит по websocket. Без этих трёх строк подписки на
        # странице поездки не поднимутся, а цена перестанет обновляться живьём.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # СЖАТИЕ — самое важное в этом файле.
    #
    # Сейчас ответы сжимают Supabase и Vercel. После переезда это исчезнет
    # молча: Kong по умолчанию не сжимает ничего, сайт продолжит работать,
    # просто съест канал. Замерено: ответ ленты 33 982 Б без сжатия и 4 789 Б
    # с gzip — в семь раз. При тысяче одновременных вкладок это 17,7 против
    # 2,5 Мбит/с, при пяти тысячах — 88 Мбит/с из тарифных 100.
    gzip            on;
    gzip_proxied    any;    # ключевая строка: без неё проксированное не сжимается
    gzip_types      application/json;
    gzip_min_length 512;    # мелочь сжимать дороже, чем отдать как есть
    gzip_comp_level 5;      # выше — заметно дороже по процессору, выигрыш копеечный

    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

# --------------------------------------------------------------------------
# Перенаправление с http
# --------------------------------------------------------------------------
server {
    listen 80;
    server_name <ДОМЕН> api.<ДОМЕН>;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
