# Заголовки безопасности APSNY-TRANSFER.
#
# Подключается командой `include` В КАЖДЫЙ location фронтенда, а не один раз
# на уровне server. Причина — правило nginx: add_header наследуется из
# внешнего блока ТОЛЬКО если во внутреннем нет ни одного своего add_header.
# Стоит в location хотя бы один add_header (например, Cache-Control) —
# все заголовки уровня server для этого location пропадают молча.
# Раньше из-за этого главная страница отдавалась без CSP и HSTS
# (аудит 29.09.2026, пункт В-2).
#
# `always` — чтобы заголовки были и на ответах с ошибками (404, 500).
#
# ПРИ ПЕРЕЕЗДЕ заменить <ДОМЕН> в строке Content-Security-Policy.
# При подключении Т-Бизнес — form-action: вместо yoomoney.ru домен платёжной
# формы банка (если оплата через форму; при переходе по ссылке PaymentURL
# менять не нужно).

add_header X-Frame-Options            "SAMEORIGIN" always;
add_header X-Content-Type-Options     "nosniff" always;
add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
add_header Permissions-Policy         "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Content-Security-Policy    "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://images.unsplash.com https://api.<ДОМЕН>; connect-src 'self' https://api.<ДОМЕН> wss://api.<ДОМЕН>; worker-src 'self'; manifest-src 'self'; form-action 'self' https://yoomoney.ru; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
